<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Explorer — Vancouver Housing Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared/theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        #map-container {
            height: 380px;
            border-radius: 4px;
            border: 1px solid var(--rule-faint);
            margin-top: 10px;
        }
        .map-legend {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: var(--ink-soft);
            margin-top: 8px;
        }
        .map-legend .gradient-bar {
            flex: 1;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #2f6b34, #a3372b);
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<nav class="site-nav" id="site-nav"></nav>

<div class="tear-strip"></div>
<div class="sheet">
    <div class="fastener"></div>
    <header class="report-head">
        <h1>Rent Explorer</h1>
        <span class="report-no">No. 0002</span>
    </header>

    <div class="field-block">
        <div class="field">
            <label for="mode">View</label>
            <select id="mode">
                <option value="single">One city, all unit types</option>
                <option value="compare">Compare cities (chart)</option>
                <option value="map">Compare cities (map)</option>
            </select>
        </div>

        <div class="field" id="city-field">
            <label for="city-select">City</label>
            <select id="city-select"></select>
        </div>

        <div class="field" id="bedroom-field" style="display:none;">
            <label for="bedroom-select">Unit type to compare</label>
            <select id="bedroom-select">
                <option value="Studio">Studio</option>
                <option value="1 Bedroom" selected>1 Bedroom</option>
                <option value="2 Bedroom">2 Bedroom</option>
                <option value="3 Bedroom +">3 Bedroom +</option>
            </select>
        </div>
    </div>

    <p class="status-line" id="status"></p>

    <div id="chart-wrap" style="margin-top: 10px;">
        <canvas id="rent-chart" height="220"></canvas>
    </div>

    <div id="map-container" class="hidden"></div>
    <div class="map-legend hidden" id="map-legend">
        <span>Cheaper</span>
        <div class="gradient-bar"></div>
        <span>Pricier</span>
    </div>

    <section class="ledger" id="ledger-table" style="margin-top: 26px;"></section>

    <div id="calc-link-wrap" style="margin-top: 26px; display:none;">
        <button class="primary-btn" id="go-to-calculator">Check affordability in this city</button>
    </div>

    <footer class="report-foot">
        Data: CMHC Rental Market Survey, by bedroom type and city · Map tiles © OpenStreetMap contributors
    </footer>
</div>

<script src="shared/background.js"></script>
<script src="shared/api.js"></script>
<script src="shared/state.js"></script>
<script src="shared/nav.js"></script>
<script>
    const modeSelect = document.getElementById("mode");
    const cityField = document.getElementById("city-field");
    const bedroomField = document.getElementById("bedroom-field");
    const citySelect = document.getElementById("city-select");
    const bedroomSelect = document.getElementById("bedroom-select");
    const status = document.getElementById("status");
    const ledgerTable = document.getElementById("ledger-table");
    const calcLinkWrap = document.getElementById("calc-link-wrap");
    const chartWrap = document.getElementById("chart-wrap");
    const mapContainer = document.getElementById("map-container");
    const mapLegend = document.getElementById("map-legend");

    let regions = [];
    let chart = null;
    let map = null;
    let markers = [];

    const CHART_GREEN = "#2f6b34";
    const CHART_GREEN_SOFT = "#9fc191";

    // Approximate city-centre coordinates for the map view.
    const CITY_COORDS = {
        "Vancouver": [49.2827, -123.1207],
        "Burnaby": [49.2488, -122.9805],
        "Surrey": [49.1913, -122.8490],
        "Richmond": [49.1666, -123.1336],
        "Coquitlam": [49.2838, -122.7932],
        "New Westminster": [49.2057, -122.9110],
        "North Vancouver": [49.3200, -123.0724],
        "West Vancouver": [49.3287, -123.1596],
    };

    function hexToRgb(hex) {
        const v = parseInt(hex.replace("#", ""), 16);
        return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
    }
    function lerpColor(hexA, hexB, t) {
        const a = hexToRgb(hexA), b = hexToRgb(hexB);
        const r = Math.round(a.r + (b.r - a.r) * t);
        const g = Math.round(a.g + (b.g - a.g) * t);
        const bl = Math.round(a.b + (b.b - a.b) * t);
        return `rgb(${r}, ${g}, ${bl})`;
    }

    function renderChart(labels, values, label) {
        const ctx = document.getElementById("rent-chart").getContext("2d");
        if (chart) chart.destroy();
        chart = new Chart(ctx, {
            type: "bar",
            data: {
                labels,
                datasets: [{
                    label,
                    data: values,
                    backgroundColor: CHART_GREEN_SOFT,
                    borderColor: CHART_GREEN,
                    borderWidth: 1.5,
                    borderRadius: 3,
                }],
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { callback: (v) => "$" + v.toLocaleString() },
                        grid: { color: "rgba(74,90,67,0.08)" },
                    },
                    x: { grid: { display: false } },
                },
            },
        });
    }

    function renderLedgerRows(rows) {
        ledgerTable.innerHTML = rows
            .map(r => `<div class="ledger-row"><span>${r.label}</span><span class="amount">${money(r.value)}</span></div>`)
            .join("");
    }

    function ensureMap() {
        if (map) return;
        map = L.map("map-container", { scrollWheelZoom: false }).setView([49.24, -123.05], 9.6);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors",
            maxZoom: 18,
        }).addTo(map);

        window.addEventListener("resize", () => map.invalidateSize());
    }

    function renderMap(rows, bedroomType) {
        ensureMap();
        markers.forEach(m => map.removeLayer(m));
        markers = [];

        const rents = rows.map(r => r.avg_rent);
        const min = Math.min(...rents);
        const max = Math.max(...rents);

        rows.forEach(r => {
            const coords = CITY_COORDS[r.region_name];
            if (!coords) return;
            const t = max === min ? 0 : (r.avg_rent - min) / (max - min);
            const color = lerpColor("#2f6b34", "#a3372b", t);
            const radius = 10 + t * 16;

            const marker = L.circleMarker(coords, {
                radius,
                fillColor: color,
                color: "#1c2a17",
                weight: 1,
                fillOpacity: 0.85,
            })
                .addTo(map)
                .bindPopup(`<strong>${r.region_name}</strong><br>${bedroomType}: ${money(r.avg_rent)}`);

            marker.on("click", () => {
                modeSelect.value = "single";
                citySelect.value = r.region_id;
                refresh();
            });

            markers.push(marker);
        });

        setTimeout(() => map.invalidateSize(), 60);
        setTimeout(() => map.invalidateSize(), 300);
    }

    async function loadSingleCity(regionId) {
        const res = await fetch(`${API_BASE}/rent-data/${regionId}`);
        const data = await res.json();

        if (!data.rents || !data.rents.length) {
            status.textContent = `No rent data imported yet for ${data.region_name}.`;
            if (chart) { chart.destroy(); chart = null; }
            ledgerTable.innerHTML = "";
            calcLinkWrap.style.display = "none";
            return;
        }
        status.textContent = "";

        const order = ["Studio", "1 Bedroom", "2 Bedroom", "3 Bedroom +", "Total"];
        const sorted = [...data.rents].sort((a, b) => order.indexOf(a.bedroom_type) - order.indexOf(b.bedroom_type));

        renderChart(sorted.map(r => r.bedroom_type), sorted.map(r => r.avg_rent), `${data.region_name} average rent`);
        renderLedgerRows(sorted.map(r => ({ label: r.bedroom_type, value: r.avg_rent })));

        calcLinkWrap.style.display = "block";
        calcLinkWrap.dataset.regionId = data.region_id;
        calcLinkWrap.dataset.regionName = data.region_name;
    }

    async function loadAllCitiesForBedroom(bedroomType) {
        const res = await fetch(`${API_BASE}/rent-data/`);
        const allRegions = await res.json();

        return allRegions
            .map(r => {
                const match = r.rents.find(x => x.bedroom_type === bedroomType);
                return match ? { region_name: r.region_name, avg_rent: match.avg_rent, region_id: r.region_id } : null;
            })
            .filter(Boolean)
            .sort((a, b) => a.avg_rent - b.avg_rent);
    }

    async function loadCompareCities(bedroomType) {
        const rows = await loadAllCitiesForBedroom(bedroomType);
        if (!rows.length) {
            status.textContent = `No cities have data for ${bedroomType} yet.`;
            if (chart) { chart.destroy(); chart = null; }
            ledgerTable.innerHTML = "";
            calcLinkWrap.style.display = "none";
            return;
        }
        status.textContent = "";
        renderChart(rows.map(r => r.region_name), rows.map(r => r.avg_rent), `${bedroomType} average rent by city`);
        renderLedgerRows(rows.map(r => ({ label: r.region_name, value: r.avg_rent })));
        calcLinkWrap.style.display = "none";
    }

    async function loadMapCities(bedroomType) {
        const rows = await loadAllCitiesForBedroom(bedroomType);
        if (!rows.length) {
            status.textContent = `No cities have data for ${bedroomType} yet.`;
            ledgerTable.innerHTML = "";
            calcLinkWrap.style.display = "none";
            return;
        }
        status.textContent = "";
        renderMap(rows, bedroomType);
        renderLedgerRows(rows.map(r => ({ label: r.region_name, value: r.avg_rent })));
        calcLinkWrap.style.display = "none";
    }

    function refresh() {
        calcLinkWrap.style.display = "none";

        if (modeSelect.value === "single") {
            cityField.style.display = "flex";
            bedroomField.style.display = "none";
            chartWrap.classList.remove("hidden");
            mapContainer.classList.add("hidden");
            mapLegend.classList.add("hidden");
            if (citySelect.value) loadSingleCity(citySelect.value);

        } else if (modeSelect.value === "compare") {
            cityField.style.display = "none";
            bedroomField.style.display = "flex";
            chartWrap.classList.remove("hidden");
            mapContainer.classList.add("hidden");
            mapLegend.classList.add("hidden");
            loadCompareCities(bedroomSelect.value);

        } else {
            cityField.style.display = "none";
            bedroomField.style.display = "flex";
            chartWrap.classList.add("hidden");
            mapContainer.classList.remove("hidden");
            mapLegend.classList.remove("hidden");
            loadMapCities(bedroomSelect.value);
        }
    }

    async function init() {
        try {
            regions = await fetchRegions();
            citySelect.innerHTML = regions.map(r => `<option value="${r.id}">${r.name}</option>`).join("");

            const selected = getSelectedRegion();
            if (selected && regions.some(r => r.id === selected.id)) {
                citySelect.value = selected.id;
            }
            refresh();
        } catch (err) {
            status.textContent = "Can't reach the backend — is uvicorn running on port 8000?";
        }
    }

    modeSelect.addEventListener("change", refresh);
    citySelect.addEventListener("change", refresh);
    bedroomSelect.addEventListener("change", refresh);

    document.getElementById("go-to-calculator").addEventListener("click", () => {
        setSelectedRegion(calcLinkWrap.dataset.regionId, calcLinkWrap.dataset.regionName);
        window.location.href = "calculator.html";
    });

    init();
</script>

</body>
</html>
