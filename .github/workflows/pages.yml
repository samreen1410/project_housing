# Publishes the frontend folder as the website on GitHub Pages.
# It runs by itself whenever something inside frontend/ changes on main,
# and you can also start it by hand from the Actions tab.
name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer one waits for the current one to finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Package the frontend folder
        uses: actions/upload-pages-artifact@v4
        with:
          path: "frontend"

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4